<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DiHax</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#1f1f1f;--muted:#5f6368;--code:#f1f3f4;--link:#0b57d0}
@media (prefers-color-scheme:dark){:root{--bg:#131314;--fg:#e3e3e3;--muted:#9aa0a6;--code:#28292a;--link:#a8c7fa}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:40px 16px 64px}
h1{font-size:2rem;line-height:1.2;margin:0 0 8px}h2{font-size:1.25rem;margin:32px 0 8px}
p,li{color:var(--fg)}code{background:var(--code);padding:1px 6px;border-radius:6px;font-size:.9em}
a{color:var(--link)}ul{padding-left:22px}
</style>
</head>
<body>
<main>
<h1>DiHax</h1>
<ul>
<li><a href="applab/">AppLab</a></li>
</ul>
<p>Contact: <a href="mailto:contact@dihax.com">contact@dihax.com</a></p>
</main>
</body>
</html>
